# hyprlock-media example: animated background + animated image widget
# Copy to ~/.config/hypr/hyprlock.conf and adjust the paths.
#
# The binary is still called `hyprlock`; only the media_* keys are new.

$font = Monospace
$accent = rgb(a9c7ff)
$fg = rgb(dee2ef)
$muted = rgb(8c919c)

general {
    hide_cursor = true
}

# Animated video background.
# The file is decoded at output resolution (or half if blur is on).
background {
    monitor =
    path = ~/wallpapers/butterfly.mp4
    color = 0xFF0f131c

    # Uncomment for a soft background. Three passes at half resolution cost
    # much less than a full-resolution blur per frame.
    # blur_passes = 2
    # blur_size = 6
    # brightness = 0.9
    # contrast = 0.85

    media_loop = true
    media_fps = 30       # 24 on slower machines; 0 = source fps
    media_speed = 1.0
    media_scale = 0      # 0 = auto; 0.75 = 75% of the decoded size
}

# Animated GIF/WebP in a badge.
image {
    monitor =
    path = ~/wallpapers/spinner.gif
    size = 120
    position = 0, 190
    halign = center
    valign = center
    rounding = -1
    border_size = 0
    media_fps = 15       # GIFs are usually 10-15fps anyway
}

# Clock.
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Date.
label {
    monitor =
    text = cmd[update:43200000] date "+%A, %d %B %Y"
    color = $accent
    font_size = 16
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

# Password field.
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    rounding = 0
    outer_color = $accent
    inner_color = rgba(15, 19, 28, 0.8)
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    placeholder_text = Password...
    check_color = $accent
    fail_color = rgb(ffb4ab)
    fail_text = Incorrect password ($ATTEMPTS)
    position = 0, -70
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Small status line.
label {
    monitor =
    text = cmd[update:10000] echo "LOCKED"
    color = $muted
    font_size = 11
    font_family = $font
    position = 0, 30
    halign = center
    valign = bottom
}
